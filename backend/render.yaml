# Render Blueprint: one web service that serves both the API and the frontend (same origin, so cookies and
# CORS need no extra setup). Secret values are never stored in this file: set them in the Render dashboard.
#
# First deployment, in order:
#   1. Create the PostgreSQL database and copy its connection string.
#      Use the DIRECT (non-pooled) connection string with sslmode=require, because the start command runs
#      `prisma migrate deploy`, which needs a session-level connection.
#   2. Deploy this blueprint and set DATABASE_URL (and GROQ_API_KEY if the AI Assistant should be enabled).
#      JWT_SECRET is generated by Render.
#   3. Optional base content, run once from a machine that has the production DATABASE_URL:
#        cd backend && NODE_ENV=production npm run db:seed
#      With NODE_ENV=production it only adds missing base content. It creates no accounts, no employee records
#      and no activity, and it never deletes anything.
#   4. Register in the app, then promote that account (no default admin exists):
#        cd backend && npm run admin:promote -- you@example.edu SUPER_ADMIN
services:
  - type: web
    name: campussphere
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    # Applies committed migrations (additive and non-destructive on a current database), then starts the server.
    startCommand: npx prisma migrate deploy && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
