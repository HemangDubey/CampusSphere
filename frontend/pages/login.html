<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | CampusSphere</title>
  <meta name="theme-color" content="#fdf8f3">
  <meta name="api-base" content="">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-auth-page="login">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" data-nav></header>
  <main id="main" class="auth">
    <div class="container auth__grid">
      <aside class="auth__aside">
        <span class="label label--accent">Welcome back</span>
        <h1 class="display auth__title">Pick up<br><em>where you left off</em></h1>
        <p class="auth__lead">Sign in with your university email to reach your dashboard, events and AI Assistant.</p>
      </aside>
      <section class="auth__card panel" aria-labelledby="auth-heading">
        <h2 id="auth-heading" class="panel__title">Sign in</h2>
        <div class="notice notice--error" data-form-notice role="alert" hidden><span class="notice__icon" aria-hidden="true"></span><p></p></div>
        <div class="notice notice--success" data-form-success role="status" hidden><span class="notice__icon" aria-hidden="true"></span><p></p></div>
        <form class="form" data-auth-form novalidate>
          <div class="field">
            <label class="field__label" for="email">University email<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="you@university.edu">
            <p class="field__error" id="email-error"></p>
          </div>
          <div class="field">
            <label class="field__label" for="password">Password<span class="req" aria-hidden="true">*</span></label>
            <div class="input-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" data-error="Enter your password (at least 8 characters).">
              <button class="input-wrap__toggle" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="field__error" id="password-error"></p>
          </div>
          <div class="auth__row"><a class="auth__link" href="/forgot-password">Forgot password?</a></div>
          <button class="button button--lg button--block" type="submit">Sign in</button>
        </form>
        <p class="auth__switch">New to CampusSphere? <a class="auth__link" href="/register">Create an account</a></p>
      </section>
    </div>
  </main>
  <footer class="footer" data-footer></footer>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
