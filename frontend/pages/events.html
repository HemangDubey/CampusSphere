<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Events | CampusSphere</title>
  <meta name="theme-color" content="#fdf8f3">
  <meta name="api-base" content="">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/campus.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" data-nav></header>
  <main id="main" class="page">
    <div class="container">
      <div class="page__head">
        <span class="label label--accent">Campus events</span>
        <h1 class="display page__title">What's <em>happening</em></h1>
        <p class="page__lead">Find symposiums, workshops, cultural nights and sports meets, then register in one click.</p>
      </div>
      <p class="banner" role="note">The events listed here are <strong>demonstration records</strong>, not verified campus announcements. Confirm real events with your institution.</p>

      <div class="tabs" role="tablist" aria-label="Events view">
        <button class="tab" role="tab" id="tab-all" aria-selected="true" aria-controls="panel" data-view="all">All events</button>
        <button class="tab" role="tab" id="tab-mine" aria-selected="false" aria-controls="panel" data-view="mine">My registrations</button>
      </div>

      <form class="filters" data-filters role="search" aria-label="Filter events" novalidate>
        <div class="field field--wide"><label class="field__label" for="q">Search</label><input class="input" id="q" name="q" type="search" maxlength="80" placeholder="Name, keyword or venue"></div>
        <div class="field"><label class="field__label" for="category">Category</label>
          <select class="select" id="category" name="category"><option value="">All categories</option><option value="TECHNICAL">Technical</option><option value="CULTURAL">Cultural</option><option value="SPORTS">Sports</option><option value="WORKSHOP">Workshop</option><option value="SYMPOSIUM">Symposium</option></select></div>
        <div class="field"><label class="field__label" for="mode">Event type</label>
          <select class="select" id="mode" name="mode"><option value="">Any type</option><option value="IN_PERSON">In person</option><option value="ONLINE">Online</option><option value="HYBRID">Hybrid</option></select></div>
        <div class="field"><label class="field__label" for="from">From date</label><input class="input" id="from" name="from" type="date"></div>
        <div class="field"><label class="field__label" for="to">To date</label><input class="input" id="to" name="to" type="date"></div>
        <button class="button button--secondary" type="reset">Clear filters</button>
      </form>

      <div id="panel" role="tabpanel" aria-live="polite">
        <p class="results-note" data-count></p>
        <div class="cards" data-list></div>
        <div class="pager" data-pager></div>
      </div>
    </div>
  </main>

  <dialog class="modal" data-dialog aria-labelledby="dlg-title">
    <div class="modal__head"><h2 id="dlg-title" data-dlg-title></h2><button class="button button--ghost button--sm" type="button" data-close aria-label="Close details">Close</button></div>
    <div class="modal__body" data-dlg-body></div>
  </dialog>
  <footer class="footer" data-footer></footer>
  <script type="module" src="/js/events.js"></script>
</body>
</html>
