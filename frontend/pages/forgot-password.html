<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | CampusSphere</title>
  <meta name="theme-color" content="#fdf8f3">
  <meta name="api-base" content="">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-auth-page="forgot">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" data-nav></header>
  <main id="main" class="auth">
    <div class="container auth__grid">
      <aside class="auth__aside">
        <span class="label label--accent">Account recovery</span>
        <h1 class="display auth__title">Forgot<br><em>your password?</em></h1>
        <p class="auth__lead">Enter your university email and we will start a password reset for your account.</p>
      </aside>
      <section class="auth__card panel" aria-labelledby="auth-heading">
        <h2 id="auth-heading" class="panel__title">Reset your password</h2>
        <div class="notice notice--error" data-form-notice role="alert" hidden><span class="notice__icon" aria-hidden="true"></span><p></p></div>
        <div class="notice notice--success" data-form-success role="status" hidden><span class="notice__icon" aria-hidden="true"></span><p></p></div>
        <form class="form" data-auth-form novalidate>
          <div class="field">
            <label class="field__label" for="email">University email<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="you@university.edu">
            <p class="field__error" id="email-error"></p>
          </div>
          <button class="button button--lg button--block" type="submit">Send reset link</button>
        </form>
        <p class="auth__switch"><a class="auth__link" href="/login">Back to sign in</a></p>
      </section>
    </div>
  </main>
  <footer class="footer" data-footer></footer>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
